name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Sideload-from-GitHub is the product. Play Store is not a goal.
      # A stable keystore is optional (one SHA-1 for Google Sign-In).
      # Without it the APK is debug-signed and still installs.
      - name: Optional stable keystore
        env:
          CAB_KEYSTORE_BASE64: ${{ secrets.CAB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${CAB_KEYSTORE_BASE64}" ]]; then
            echo "$CAB_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/cab.jks"
            echo "CAB_STORE_FILE=${RUNNER_TEMP}/cab.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        env:
          CAB_STORE_PASSWORD: ${{ secrets.CAB_STORE_PASSWORD }}
          CAB_KEY_ALIAS: ${{ secrets.CAB_KEY_ALIAS }}
          CAB_KEY_PASSWORD: ${{ secrets.CAB_KEY_PASSWORD }}
          CAB_MAILBOX_ORIGIN: ${{ secrets.CAB_MAILBOX_ORIGIN || vars.CAB_MAILBOX_ORIGIN }}
          CAB_GOOGLE_WEB_CLIENT_ID: ${{ secrets.CAB_GOOGLE_WEB_CLIENT_ID || vars.CAB_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name APK
        run: |
          set -euo pipefail
          name="$(tr -d '[:space:]' < VERSION)"
          name="${name#v}"
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$src"
          mkdir -p dist
          cp "$src" "dist/gantry-cab-${name}.apk"
          echo "APK=dist/gantry-cab-${name}.apk" >> "$GITHUB_ENV"

      - name: Signing cert SHA-1
        run: |
          set -euo pipefail
          name="$(basename "$APK" .apk)"
          sha_file="dist/${name}-sha1.txt"
          ./scripts/apk-sha1.sh "$APK" "$sha_file"
          if [[ -n "${CAB_STORE_FILE:-}" ]]; then
            kind=stable
          else
            kind=ephemeral
          fi
          ./scripts/apk-sha1.sh --notes "$(cat "$sha_file")" "$kind" > dist/release-notes-sha1.md
          echo "SHA1_FILE=$sha_file" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          else
            extra+=(--latest)
          fi
          notes="$(mktemp)"
          {
            cat dist/release-notes-sha1.md
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$GITHUB_REF_NAME" \
              --jq .body || true
          } > "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — uploading APK + SHA-1"
            gh release upload "$GITHUB_REF_NAME" "$APK" "$SHA1_FILE" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$SHA1_FILE" --notes-file "$notes" "${extra[@]}"

      - name: Point latest git tag at this release
        # Keep a floating `latest` tag on the same commit as the version tag (v*).
        # Skip prereleases (semver with a hyphen, e.g. v1.2.3-rc.1).
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag -fa latest -m "Release ${GITHUB_REF_NAME} (latest)"
          git push --force origin refs/tags/latest
