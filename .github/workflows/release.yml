name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional Play keystore
        env:
          CAB_KEYSTORE_BASE64: ${{ secrets.CAB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${CAB_KEYSTORE_BASE64}" ]]; then
            echo "$CAB_KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/cab.jks"
            echo "CAB_STORE_FILE=${RUNNER_TEMP}/cab.jks" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK
        env:
          CAB_STORE_PASSWORD: ${{ secrets.CAB_STORE_PASSWORD }}
          CAB_KEY_ALIAS: ${{ secrets.CAB_KEY_ALIAS }}
          CAB_KEY_PASSWORD: ${{ secrets.CAB_KEY_PASSWORD }}
          CAB_MAILBOX_ORIGIN: ${{ secrets.CAB_MAILBOX_ORIGIN || vars.CAB_MAILBOX_ORIGIN }}
          CAB_GOOGLE_WEB_CLIENT_ID: ${{ secrets.CAB_GOOGLE_WEB_CLIENT_ID || vars.CAB_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name APK
        run: |
          set -euo pipefail
          name="$(tr -d '[:space:]' < VERSION)"
          name="${name#v}"
          src="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$src"
          mkdir -p dist
          cp "$src" "dist/gantry-cab-${name}.apk"
          echo "APK=dist/gantry-cab-${name}.apk" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          else
            extra+=(--latest)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — uploading APK"
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" --generate-notes "${extra[@]}"

      - name: Point latest git tag at this release
        # Keep a floating `latest` tag on the same commit as the version tag (v*).
        # Skip prereleases (semver with a hyphen, e.g. v1.2.3-rc.1).
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Release ${GITHUB_REF_NAME} (latest)"
          git push --force origin refs/tags/latest
