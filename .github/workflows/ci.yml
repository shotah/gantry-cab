name: ci

on:
  push:
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "assets/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Script tests
        run: |
          chmod +x scripts/*.sh test/scripts/*.test.sh
          make test-scripts

      - name: Lint + test + coverage
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest createDebugUnitTestCoverageReport --build-cache --configuration-cache

      - name: Coverage bar (70%)
        run: |
          set -euo pipefail
          chmod +x scripts/jacoco-pct.sh scripts/coverage-gate.sh
          XML="$(find app/build/reports -name 'report.xml' | head -n1)"
          test -n "${XML}"
          COVERAGE_MIN=70 ./scripts/coverage-gate.sh "$XML"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            app/build/reports/coverage/**/report.xml
            app/build/reports/jacoco/**/*.xml

      - name: Generate coverage badge
        run: |
          set -euo pipefail
          mkdir -p badges
          chmod +x scripts/coverage-badge.sh
          XML="$(find app/build/reports -name 'report.xml' | head -n1)"
          test -n "${XML}"
          ./scripts/coverage-badge.sh "$XML" badges/coverage.svg

      - name: Upload coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: badges/coverage.svg

  # gh-pages hosts badges/coverage.svg. Pages source: branch gh-pages / (root).
  badge:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: badges

      - name: Push gh-pages (coverage badge)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BADGE="${GITHUB_WORKSPACE}/badges/coverage.svg"
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          if git fetch --depth 1 origin gh-pages; then
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p badges
          cp "$BADGE" badges/coverage.svg
          touch .nojekyll

          git add -A
          if git diff --staged --quiet; then
            echo "No gh-pages change; skipping push."
          else
            git commit -m "chore: publish coverage badge [skip ci]"
            git push origin HEAD:gh-pages
          fi
